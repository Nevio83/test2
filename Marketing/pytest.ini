[pytest]
# Aufruf immer als "py -m pytest" aus dem Ordner Marketing/ heraus
# (pytest.exe liegt auf diesem Rechner nicht im PATH).
testpaths = tests
python_files = test_*.py
addopts = -q -p no:cacheprovider
# no:cacheprovider: das Anlegen von .pytest_cache schlaegt in dieser
# Windows-Umgebung mit WinError 2 fehl und erzeugt bei jedem Lauf zwei
# Warnungen. Der Zwischenspeicher bringt hier nichts (kein --lf-Workflow),
# also wird er abgeschaltet statt die Warnung zu ignorieren.
filterwarnings =
    error::DeprecationWarning
    default
