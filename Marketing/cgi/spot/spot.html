<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Maios Motion-Spot</title>
<!--
  Maios Motion-Spot: 2D-Motion-Design (Typo, App-Elemente, echte Fotos) im Vollbild 1080x1920.
  Gesteuert nur über die Zeit: window.__frame(t) setzt jedes Element für Sekunde t (deterministisch).
  Aufruf:  spot.html?cfg=<datei>.json        (Konfiguration, Pfad relativ zu dieser Seite)
           spot.html?cfg=...&t=3.2            (zeigt genau dieses Bild, zum Ansehen ohne Renderer)
  Schnittstelle für render_spot.mjs: window.__ready, window.__dauer, window.__frame(t), window.__events
  Bildpfade in der Konfiguration relativ zum Repo-Stamm ("produkt bilder/..."), der Renderer liefert ihn aus.
-->
<style>
@font-face{font-family:'Manrope';src:url(../fonts/manrope-latin.woff2) format('woff2');font-weight:200 800}
@font-face{font-family:'Manrope';src:url(../fonts/manrope-latin-ext.woff2) format('woff2');font-weight:200 800;unicode-range:U+0100-02BA,U+20A0-20C0}
:root{--akz:#C97A5A;--bg1:#F4F1EC;--bg2:#E9E3D9;--ink:#141414;--grau:#6F6A62}
html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:var(--bg1)}
*{box-sizing:border-box}
#b{position:absolute;inset:0;font-family:Manrope,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
#bg{position:absolute;inset:0}
.sz{position:absolute;inset:0;will-change:opacity,filter,transform}
.abs{position:absolute}
.wort{display:inline-block;will-change:transform,opacity,filter;white-space:pre}
.typo{left:70px;right:150px;top:740px;font-weight:800;font-size:118px;line-height:1.02;letter-spacing:-.035em}
.typo.klein{font-size:84px;letter-spacing:-.025em}
.typo .ak{color:var(--akz)}
.such{left:90px;width:760px;top:860px;height:132px;border-radius:66px;background:#fff;box-shadow:0 30px 80px rgba(0,0,0,.10),0 4px 14px rgba(0,0,0,.06);display:flex;align-items:center;padding:0 40px 0 52px;font-size:46px;font-weight:600}
.such .txt{flex:1;white-space:nowrap;overflow:hidden}
.such .cur{display:inline-block;width:4px;height:52px;background:var(--akz);vertical-align:-10px;margin-left:4px}
.such .lupe{width:84px;height:84px;border-radius:42px;background:var(--akz);display:flex;align-items:center;justify-content:center}
.such .ph{color:#B2ACA2}
.status{left:90px;width:760px;top:1030px;text-align:center;font-size:36px;font-weight:600;color:var(--grau)}
.karte{border-radius:44px;overflow:hidden;background:#fff;box-shadow:0 40px 90px rgba(0,0,0,.16),0 6px 18px rgba(0,0,0,.07)}
.karte img{display:block;width:100%;height:100%;object-fit:cover}
.gk{position:absolute;border-radius:30px;overflow:hidden;background:#fff;box-shadow:0 24px 60px rgba(0,0,0,.14)}
.gk img{width:100%;height:100%;object-fit:cover;display:block}
.gk .lbl{position:absolute;left:16px;bottom:16px;padding:8px 16px;border-radius:20px;background:rgba(255,255,255,.92);font-size:24px;font-weight:700}
.pk{left:110px;width:720px;top:470px;height:960px;border-radius:52px;background:#fff;box-shadow:0 50px 110px rgba(0,0,0,.18),0 6px 18px rgba(0,0,0,.06);overflow:hidden}
.pk .foto{position:absolute;left:0;top:0;width:720px;height:720px;object-fit:cover}
.pk .nm{position:absolute;left:44px;right:150px;top:756px;font-size:46px;font-weight:800;letter-spacing:-.02em;line-height:1.08}
.pk .nz{position:absolute;left:44px;right:44px;top:872px;font-size:32px;font-weight:600;color:var(--grau);line-height:1.25}
.pk .herz{position:absolute;right:40px;top:752px;width:96px;height:96px;border-radius:48px;background:#F3EFE8;display:flex;align-items:center;justify-content:center}
.toast{left:240px;width:460px;top:1420px;height:88px;border-radius:44px;background:var(--ink);color:#fff;font-size:36px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:16px}
.nl{left:90px;width:760px;font-size:52px;font-weight:700;letter-spacing:-.015em;display:flex;align-items:center;gap:30px;line-height:1.1}
.nl svg{flex:0 0 auto}
.zahl{left:205px;width:520px;top:560px;height:520px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:250px;letter-spacing:-.05em;line-height:1}  /* genau im Ring zentriert */
.zlbl{left:0;width:930px;top:1110px;text-align:center;font-size:62px;font-weight:700;letter-spacing:-.01em}
.ring{left:205px;top:560px}
.ende-w{left:0;width:930px;top:780px;text-align:center;font-size:58px;font-weight:800;color:#3F3A35}
.ende-p{left:0;width:930px;top:870px;text-align:center;font-size:190px;font-weight:800;letter-spacing:-.045em;line-height:1}
.ende-l{left:285px;width:360px;top:1140px;height:100px;border-radius:50px;background:var(--akz);color:#fff;font-size:40px;font-weight:800;display:flex;align-items:center;justify-content:center}
.hinw{left:0;width:930px;top:1270px;text-align:center;font-size:40px;font-weight:700;color:#3A3A3A}
.marke{left:0;width:930px;top:1390px;text-align:center;font-size:40px;font-weight:800;letter-spacing:.32em;color:var(--ink);opacity:.55}
.dk{width:410px;height:520px;top:640px;border-radius:40px;overflow:hidden;background:#fff;box-shadow:0 30px 70px rgba(0,0,0,.16)}
.dk img{width:100%;height:100%;object-fit:cover;display:block}
.dn{width:410px;top:1190px;text-align:center;font-size:46px;font-weight:800;letter-spacing:-.02em}
.vs{z-index:5;left:395px;top:830px;width:140px;height:140px;border-radius:70px;background:var(--akz);color:#fff;font-size:40px;font-weight:800;display:flex;align-items:center;justify-content:center;box-shadow:0 14px 40px rgba(0,0,0,.18)}
.dfrage{left:0;width:930px;top:1320px;text-align:center;font-size:58px;font-weight:800;letter-spacing:-.025em}
#ober{position:absolute;left:0;top:0;width:1080px;height:1920px;pointer-events:none}
.pill{position:absolute;top:200px;height:60px;border-radius:30px;padding:0 24px;font-size:30px;font-weight:700;display:flex;align-items:center}
.pw{left:50px;background:rgba(15,15,15,.92);color:#fff}
.pp{background:#E8E8E8;color:#0F0F0F}
.oben{position:absolute;left:0;width:930px;top:300px;text-align:center}
.bk{left:90px;width:900px;top:540px;height:900px;border-radius:48px;overflow:hidden;background:#fff;box-shadow:0 40px 90px rgba(0,0,0,.16),0 6px 18px rgba(0,0,0,.07)}
.bk img{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:cover;transform-origin:50% 50%}
#ut{position:absolute;left:40px;width:850px;top:285px;text-align:center;font-family:Manrope,sans-serif;font-weight:800;font-size:60px;line-height:1.14;letter-spacing:-.02em;color:var(--ink)}
#ut .uw{display:inline-block;white-space:pre}
.oben span{display:inline-block;background:#fff;color:#111;font-size:44px;font-weight:700;padding:10px 26px;border-radius:14px;box-shadow:0 4px 18px rgba(0,0,0,.08)}
</style>
</head>
<body>
<div id="b"><div id="bg"></div><div id="szenen"></div>
<div id="ober"><div class="pill pw">Werbung</div><div class="pill pp" id="pwort"></div><div class="oben" id="oben"><span></span></div><div id="ut"></div></div></div>
<script>
// ---------- Hilfen ----------
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,x)=>a+(b-a)*x;
const seg=(t,a,b)=>clamp((t-a)/(b-a));
const E={out:x=>1-Math.pow(1-x,3),outQ:x=>1-Math.pow(1-x,5),inOut:x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2,
  back:x=>{const c=1.6;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)},in:x=>x*x*x};
function rng(s){let a=s>>>0;return()=>{a|=0;a=(a+0x6D2B79F5)|0;let t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296}}
const el=(tag,cls,par,html)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;(par||document.body).appendChild(e);return e};
const bild=p=>'/'+p.split('/').map(encodeURIComponent).join('/');
const css=(e,o)=>{for(const k in o)e.style[k]=o[k]};
const LUPE='<svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21"/></svg>';
const HERZ=(f,s)=>`<svg width="52" height="52" viewBox="0 0 24 24"><path d="M12 20.5s-7.5-4.6-9.3-9.2C1.4 7.9 3.6 4.5 7 4.5c2 0 3.3 1.1 5 3 1.7-1.9 3-3 5-3 3.4 0 5.6 3.4 4.3 6.8-1.8 4.6-9.3 9.2-9.3 9.2z" fill="${f}" stroke="${s}" stroke-width="1.8" stroke-linejoin="round"/></svg>`;
const HAKEN=(c)=>`<svg width="78" height="78" viewBox="0 0 78 78"><circle cx="39" cy="39" r="35" fill="none" stroke="${c}" stroke-width="5" class="kr" stroke-dasharray="220" /><path d="M24 40l10 10 20-22" fill="none" stroke="${c}" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" class="hk" stroke-dasharray="50"/></svg>`;

const Q=new URLSearchParams(location.search);
let CFG, SZ=[], DAUER=0; const EV=[];
const ev=(t,typ,st)=>EV.push({t:+t.toFixed(3),typ,staerke:st??1});
const UE=0.32;  // Überblendung zwischen Szenen (s)

// ---------- Szenen-Bausteine ----------
// Jeder Baustein: bau(root, s) legt Elemente an und meldet Klang-Ereignisse; set(lt, s) setzt alles für lokale Zeit lt.
const B={};

// Typo: Wörter erscheinen nacheinander (unscharf -> scharf, von unten). *wort* = Akzentfarbe, | = Zeilenumbruch.
B.typo={bau(r,s){
  s.box=el('div','abs typo'+(s.klein?' klein':''),r);
  s.w=[];let i=0;
  for(const zeile of s.text.split('|')){
    const z=el('div','',s.box);
    for(const roh of zeile.trim().split(/\s+/)){
      const ak=/^\*.*\*[.,!?]?$/.test(roh); const tx=roh.replace(/\*/g,'');
      const w=el('span','wort'+(ak?' ak':''),z,tx+' '); s.w.push({e:w,i:i++});
    }
  }
  if(s.oben_y)s.box.style.top=s.oben_y+'px';
  s.takt=s.takt||0.14;
  s.w.forEach(w=>ev(s.t0+0.05+w.i*s.takt,'tipp',0.6));
},set(lt,s){
  for(const w of s.w){const p=E.outQ(seg(lt,0.05+w.i*s.takt,0.05+w.i*s.takt+0.42));
    css(w.e,{opacity:p,filter:`blur(${(1-p)*16}px)`,transform:`translateY(${(1-p)*46}px) scale(${lerp(1.06,1,p)})`});}
}};

// Suche: Suchfeld fährt ein, Text tippt sich, Lupe wird gedrückt, Statuszeile.
B.suche={bau(r,s){
  s.f=el('div','abs such',r);s.tx=el('div','txt',s.f);s.lu=el('div','lupe',s.f,LUPE);
  s.st=el('div','abs status',r,s.status||'Suche läuft …');
  s.tipp0=0.55;s.cps=s.cps||16;s.tend=s.tipp0+s.text.length/s.cps;s.klick=s.tend+0.25;
  ev(s.t0+0.05,'whoosh',0.5);
  for(let k=0;k<s.text.length;k+=2)ev(s.t0+s.tipp0+k/s.cps,'tipp',0.5);
  ev(s.t0+s.klick,'klick',1);
},set(lt,s){
  const pin=E.out(seg(lt,0,0.45));
  css(s.f,{opacity:pin,transform:`translateY(${(1-pin)*80}px) scale(${lerp(.94,1,pin)})`});
  const n=Math.floor(clamp((lt-s.tipp0)*s.cps,0,s.text.length));
  const blink=(lt<s.tipp0||lt>s.tend)?(Math.floor(lt*2.4)%2===0):true;
  s.tx.innerHTML=(n===0&&lt<s.tipp0?`<span class="ph">${s.platzhalter||'Suchen'}</span>`:s.text.slice(0,n).replace(/ /g,'&nbsp;'))+(lt<s.klick?`<span class="cur" style="opacity:${blink?1:0}"></span>`:'');
  const kp=seg(lt,s.klick,s.klick+0.28); const dr=Math.sin(Math.PI*kp);
  css(s.lu,{transform:`scale(${1-dr*0.14})`});
  const sp=E.out(seg(lt,s.klick+0.15,s.klick+0.55));
  const sh=(lt*1.4)%1;
  css(s.st,{opacity:sp,transform:`translateY(${(1-sp)*20}px)`,backgroundImage:`linear-gradient(90deg,#8a847b ${sh*100-30}%,#d8d2c8 ${sh*100}%,#8a847b ${sh*100+30}%)`,webkitBackgroundClip:'text',color:'transparent'});
}};

// Galerie: Bildwand aus echten Fotos fliegt ein, driftet; eine Karte wird zum Helden.
B.galerie={bau(r,s){
  const R=rng(7);s.k=[];const sp=3,bw=270,gap=26,x0=(930-(sp*bw+(sp-1)*gap))/2;
  const fotos=s.fotos;const n=Math.min(fotos.length,9);
  for(let i=0;i<n;i++){const c=i%sp,row=Math.floor(i/sp);
    // Etiketten liegen im Foto -> Standard aus (kein Text auf dem Produkt); nur bei Fotos mit freiem Rand "namen": true
    const e=el('div','gk',r);e.innerHTML=`<img src="${bild(fotos[i][1])}">`+(s.namen===true?`<div class="lbl">${fotos[i][0]}</div>`:'');
    const inReihe=Math.min(sp,n-row*sp),versatz=(sp-inReihe)*(bw+gap)/2;  // unvollständige letzte Reihe mittig
    const x=x0+versatz+c*(bw+gap),y=440+row*(bw*1.18+gap)+(c===1?50:0);
    s.k.push({e,x,y,w:bw,h:bw*1.18,d:0.06*i+R()*0.05,rot:(R()-.5)*8});
  }
  s.held=s.held??Math.min(1,n-1);s.hz=s.held_ab??1.5;
  ev(s.t0+0.02,'whoosh',0.8); s.k.forEach((k,i)=>{if(i%2===0)ev(s.t0+k.d+0.2,'pop',0.35)}); ev(s.t0+s.hz,'whoosh',0.6);
},set(lt,s){
  const hp=E.inOut(seg(lt,s.hz,s.hz+0.7));
  s.k.forEach((k,i)=>{const p=E.outQ(seg(lt,k.d,k.d+0.7));const drift=-lt*14;
    let x=k.x,y=k.y+(1-p)*420+drift,w=k.w,h=k.h,rot=k.rot*(1-p),op=0.85+0.15*p,bl=0,z=1;  // ab Bild 0 sichtbar (echtes Produkt in der ersten Sekunde), fliegt nur noch ein
    if(i===s.held){x=lerp(x,110,hp);y=lerp(y,470,hp);w=lerp(w,720,hp);h=lerp(h,720,hp);z=5;const l=k.e.querySelector('.lbl');if(l)l.style.opacity=1-hp;}  // Ziel = Foto der Produktkarte (Anschluss ohne Sprung)
    else{op*=1-hp*0.85;bl=hp*10;}
    css(k.e,{left:x+'px',top:y+'px',width:w+'px',height:h+'px',opacity:op,filter:`blur(${bl}px)`,transform:`rotate(${rot}deg)`,zIndex:z,borderRadius:lerp(30,52,i===s.held?hp:0)+'px'});
  });
}};

// Produktkarte: Foto, Name, Nutzen; Herz wird angetippt -> "Gespeichert".
B.karte={bau(r,s){
  s.c=el('div','abs pk',r);s.c.innerHTML=`<img class="foto" src="${bild(s.foto)}"><div class="nm">${s.name}</div><div class="nz">${s.nutzen||''}</div><div class="herz">${HERZ('none','#141414')}</div>`;
  s.h=s.c.querySelector('.herz');s.toast=el('div','abs toast',r,HERZ('#fff','#fff')+(s.toast||'Gespeichert'));
  s.tap=s.tap??1.6;ev(s.t0+0.02,'whoosh',0.5);ev(s.t0+s.tap,'klick',1);ev(s.t0+s.tap+0.12,'pop',0.8);
},set(lt,s){
  const p=E.outQ(seg(lt,0,0.6));
  css(s.c,{opacity:p,transform:`translateY(${(1-p)*160}px) scale(${lerp(.92,1,p)})`});
  const tp=seg(lt,s.tap,s.tap+0.3),voll=lt>=s.tap+0.08;
  s.h.innerHTML=voll?HERZ('var(--akz)','var(--akz)'):HERZ('none','#141414');
  css(s.h,{transform:`scale(${1+Math.sin(Math.PI*tp)*0.28})`});
  const to=E.back(seg(lt,s.tap+0.15,s.tap+0.6))*(1-E.in(seg(lt,s.tap+1.7,s.tap+2.0)));
  css(s.toast,{opacity:clamp(to),transform:`translateY(${(1-clamp(to))*40}px) scale(${lerp(.85,1,clamp(to))})`});
}};

// Nutzen: 2–3 Zeilen mit gezeichnetem Haken (nur Angaben aus products.json!).
B.nutzen={bau(r,s){
  s.z=s.zeilen.map((tx,i)=>{const e=el('div','abs nl',r,HAKEN('var(--akz)')+`<span>${tx}</span>`);e.style.top=(640+i*190)+'px';return e});
  s.takt=s.takt||0.55;s.zeilen.forEach((_,i)=>ev(s.t0+0.15+i*s.takt,'ting',0.6));
},set(lt,s){
  s.z.forEach((e,i)=>{const a=0.1+i*s.takt,p=E.outQ(seg(lt,a,a+0.5));
    css(e,{opacity:p,transform:`translateX(${(1-p)*-60}px)`,filter:`blur(${(1-p)*8}px)`});
    e.querySelector('.kr').style.strokeDashoffset=220*(1-E.out(seg(lt,a,a+0.45)));
    e.querySelector('.hk').style.strokeDashoffset=50*(1-E.out(seg(lt,a+0.2,a+0.55)));});
}};

// Zahl: zählt hoch, Ring füllt sich (nur echte Zahlen aus products.json, z. B. Anzahl Motive).
B.zahl={bau(r,s){
  s.ring=el('div','abs ring',r,`<svg width="520" height="520" viewBox="0 0 400 400" style="opacity:.0"><circle cx="200" cy="200" r="180" fill="none" stroke="#E2DBD0" stroke-width="14"/><circle cx="200" cy="200" r="180" fill="none" stroke="var(--akz)" stroke-width="14" stroke-linecap="round" stroke-dasharray="1131" transform="rotate(-90 200 200)" class="rr"/></svg>`);
  s.zz=el('div','abs zahl',r);s.lb=el('div','abs zlbl',r,s.label||'');
  s.dz=s.zaehl||1.0;const nz=Math.min(s.wert,12);for(let k=1;k<=nz;k++)ev(s.t0+0.1+s.dz*(1-Math.cbrt(1-(k-0.5)/nz)),'tipp',0.45);  // Klick genau beim Zahlenwechsel (Umkehrung von E.out + Runden)ev(s.t0+0.1+s.dz,'ting',0.9);
},set(lt,s){
  const p=E.out(seg(lt,0.1,0.1+s.dz));s.zz.textContent=Math.round(s.wert*p);
  const sv=s.ring.querySelector('svg');sv.style.opacity=E.out(seg(lt,0,0.3))*(s.ring_an===false?0:1);
  s.ring.querySelector('.rr').style.strokeDashoffset=1131*(1-p);
  const lp=E.outQ(seg(lt,0.2,0.7));css(s.zz,{opacity:E.out(seg(lt,0,0.25)),transform:`scale(${lerp(.8,1,E.back(seg(lt,0,0.5)))})`});
  css(s.lb,{opacity:lp,transform:`translateY(${(1-lp)*30}px)`});
}};

// Duell ("Dies oder das"): zwei echte Fotos fliegen von links/rechts ein, "oder" springt auf,
// erst links, dann rechts wird angetippt (hervorgehoben), darunter die Frage. Nur Farben/Motive aus products.json.
B.duell={bau(r,s){
  s.a=el('div','abs dk',r,`<img src="${bild(s.links[1])}">`);s.b=el('div','abs dk',r,`<img src="${bild(s.rechts[1])}">`);
  s.na=el('div','abs dn',r,s.links[0]);s.nb=el('div','abs dn',r,s.rechts[0]);
  s.v=el('div','abs vs',r,s.vs||'oder');s.f=el('div','abs dfrage',r,s.frage||'');
  s.ta=s.tipp_a??0.85;s.tb=s.tipp_b??1.3;
  ev(s.t0+0.02,'whoosh',0.55);ev(s.t0+0.38,'pop',0.7);ev(s.t0+s.ta,'klick',0.9);ev(s.t0+s.tb,'klick',0.9);
},set(lt,s){
  const pa=E.outQ(seg(lt,0,0.45)),pb=E.outQ(seg(lt,0.08,0.53)),pv=E.back(seg(lt,0.32,0.62)),pf=E.out(seg(lt,0.5,0.9));
  // Hervorhebung: links zwischen tipp_a und tipp_b, rechts ab tipp_b bis kurz vor Schluss
  const ha=Math.sin(Math.PI*seg(lt,s.ta,s.tb))*1, hb=Math.sin(Math.PI*seg(lt,s.tb,s.tb+0.6));
  const kart=(e,n,x,p,h,von,rot)=>{
    css(e,{left:lerp(von,x,p)+'px',opacity:clamp(p*1.4),transform:`rotate(${lerp(rot*2.5,rot,p)}deg) scale(${1+0.06*h})`,
      boxShadow:`0 30px 70px rgba(0,0,0,.16), 0 0 0 ${8*h}px var(--akz)`,zIndex:h>0.05?3:1});
    css(n,{left:x+'px',opacity:p,color:h>0.3?'var(--akz)':'var(--ink)',transform:`translateY(${(1-p)*30}px)`});
  };
  kart(s.a,s.na,40,pa,ha,-460,-2);kart(s.b,s.nb,480,pb,hb,1100,2);
  css(s.v,{opacity:clamp(pv),transform:`scale(${clamp(pv,0,1.2)})`});
  css(s.f,{opacity:pf,transform:`translateY(${(1-pf)*24}px)`});
}};

// Bild (Format W): echtes Foto als große Karte, langsamer Zoom (Ken Burns). "fokus" [x,y] in % = Bildausschnitt
// (so lassen sich Infografik-Texte auf Herstellerfotos wegschneiden), "zoom" [von,bis]. Keine Klänge (liegt unter der Stimme).
B.bild={bau(r,s){
  s.k=el('div','abs bk',r,`<img src="${bild(s.foto)}">`);s.i=s.k.querySelector('img');
  const f=s.fokus||[50,50];s.i.style.objectPosition=f[0]+'% '+f[1]+'%';s.i.style.transformOrigin=f[0]+'% '+f[1]+'%';
  s.z=s.zoom||[1.0,1.08];if(s.klang)ev(s.t0+0.02,s.klang,0.35);
},set(lt,s){
  const p=seg(lt,0,s.dauer);css(s.i,{transform:`scale(${lerp(s.z[0],s.z[1],p)})`});
  const pin=E.outQ(seg(lt,0,0.4));css(s.k,{transform:`translateY(${(1-pin)*40}px)`});
}};

// Untertitel (Format W): CFG.untertitel = [[[sek,"Wort"],…], …] je Satz, Zeiten absolut auf der Stimme.
// Seiten mit höchstens ~38 Zeichen (2 Zeilen), gesprochene Wörter voll, das aktuelle in Akzentfarbe, kommende blass.
let UT=[];
function utTeilen(satz){
  // beste Aufteilung: Seiten <= 52 Zeichen (2 Zeilen), Umbruch nach Satzzeichen belohnt, nach Artikel/Präposition bestraft
  const FUNK=/^(der|die|das|dem|den|des|ein|eine|einer|einem|einen|ihr|ihre|in|im|um|mit|aus|über|vor|zum|und|oder|wird|ist|hält|frisch)$/i;
  const n=satz.length,L=satz.map(w=>w[1].length+1),len=L.reduce((a,b)=>a+b,0);
  const seiten=Math.max(1,Math.ceil(len/50)),ziel=len/seiten;
  const best=new Array(n+1).fill(Infinity),von=new Array(n+1).fill(-1);best[0]=0;
  for(let j=1;j<=n;j++){let m=0;for(let i=j-1;i>=0;i--){m+=L[i];if(m>53)break;
    const ende=j===n,w=satz[j-1][1],sz=/[,.;:?!]$/.test(w),fk=FUNK.test(w);
    const c=best[i]+0.35*(m-ziel)**2+(ende?0:(sz?-140:(fk?160:40)));
    if(c<best[j]){best[j]=c;von[j]=i}}}
  const out=[];for(let j=n;j>0;j=von[j])out.unshift(satz.slice(von[j],j));return out;
}
function utBauen(){
  if(!CFG.untertitel)return;
  for(const satz of CFG.untertitel)UT.push(...utTeilen(satz));
  UT.forEach((s,i)=>{s.a=i===0?0:s[0][0];  // erste Seite (Hook) ab Bild 0 komplett lesbar
   const naechste=UT[i+1];s.e=naechste?naechste[0][0]:s[s.length-1][0]+1.2;
    const letzt=s[s.length-1][0]+0.9;if(s.e>letzt+0.6)s.e=letzt+0.6;});
}
function utSetzen(t){
  const d=document.getElementById('ut');const s=UT.find(x=>t>=x.a-0.05&&t<x.e);
  if(!s){d.innerHTML='';return}
  let aktuell=-1;s.forEach((w,i)=>{if(t>=w[0]-0.02)aktuell=i});
  d.innerHTML=s.map((w,i)=>`<span class="uw" style="opacity:${i<=aktuell?1:0.5};color:${i===aktuell?'var(--akz)':'var(--ink)'}">${w[1]}</span>`).join(' ');
}

// Ende: Produktwort, Preis exakt, "Link im Profil", Marke.
B.ende={bau(r,s){
  // Pflicht bei Preisnennung (compliance_rules.json -> preisangaben): Versandhinweis. Ohne Preis (Format W) entfällt er.
  s.w=el('div','abs ende-w',r,s.wort);s.p=el('div','abs ende-p',r,s.preis||'');s.l=el('div','abs ende-l',r,s.link||'Link im Profil');
  s.hw=el('div','abs hinw',r,s.preis?(s.hinweis||'Versandkostenfrei in Deutschland'):'');s.m=el('div','abs marke',r,'MAIOS');
  ev(s.t0+0.25,'whoosh',0.5);ev(s.t0+0.5,'ting',0.8);
},set(lt,s){
  const a=E.outQ(seg(lt,0.05,0.5)),b=E.outQ(seg(lt,0.25,0.75)),c=E.back(seg(lt,0.5,0.95)),d=E.out(seg(lt,0.8,1.3));
  css(s.w,{opacity:a,transform:`translateY(${(1-a)*30}px)`});
  css(s.p,{opacity:b,filter:`blur(${(1-b)*14}px)`,transform:`scale(${lerp(1.12,1,b)})`});
  css(s.l,{opacity:clamp(c),transform:`scale(${lerp(.7,1,clamp(c))})`});
  css(s.hw,{opacity:b});css(s.m,{opacity:d*0.55});  // Versandhinweis gleichzeitig mit dem Preis (Pflicht, sobald ein Preis zu sehen ist)
}};

// ---------- Aufbau ----------
async function start(){
  CFG=await (await fetch(Q.get('cfg'))).json();
  const R=document.documentElement.style;
  if(CFG.farbe)R.setProperty('--akz',CFG.farbe);
  if(CFG.hintergrund){R.setProperty('--bg1',CFG.hintergrund[0]);R.setProperty('--bg2',CFG.hintergrund[1]);}
  document.getElementById('pwort').textContent=CFG.wort;
  const pw=document.getElementById('pwort');pw.style.left='250px';
  const ob=document.getElementById('oben');if(CFG.oben)ob.firstChild.textContent=CFG.oben;else ob.style.display='none';
  let t=0;const root=document.getElementById('szenen');
  for(const s of CFG.szenen){
    s.t0=t;s.r=el('div','sz',root);B[s.typ].bau(s.r,s);SZ.push(s);t+=s.dauer;
  }
  DAUER=t;window.__dauer=DAUER;window.__events=EV.sort((a,b)=>a.t-b.t);
  await Promise.all([...document.images].map(i=>i.decode().catch(()=>{throw new Error('Bild fehlt: '+i.src)})));
  await document.fonts.ready;
  if(!document.fonts.check('800 40px Manrope'))throw new Error('Schrift Manrope fehlt (../fonts/manrope-*.woff2)');
  utBauen();
  window.__ready=true;
  if(Q.has('t'))frame(+Q.get('t'));
}
function frame(t){
  // Hintergrund: weicher Verlauf, der langsam wandert
  const g=document.getElementById('bg');const gx=50+Math.sin(t*0.35)*18,gy=38+Math.cos(t*0.27)*10;
  g.style.background=`radial-gradient(120% 80% at ${gx}% ${gy}%, var(--bg1) 0%, var(--bg1) 35%, var(--bg2) 100%)`;
  for(const s of SZ){
    const lt=t-s.t0,ein=s===SZ[0]?1:E.out(seg(lt,-UE*0.2,UE*0.8)),aus=s===SZ[SZ.length-1]?1:1-E.in(seg(lt,s.dauer-UE*0.5,s.dauer+UE*0.5));
    const sicht=Math.min(ein,aus);
    if(lt<-UE||lt>s.dauer+UE||sicht<=0.001){s.r.style.display='none';continue}
    s.r.style.display='block';
    const kam=1+0.02*seg(lt,0,s.dauer);
    css(s.r,{opacity:sicht,filter:sicht<1?`blur(${(1-sicht)*18}px)`:'none',transform:`scale(${kam*(aus<1?lerp(1.05,1,aus):1)})`});
    B[s.typ].set(lt,s);
  }
  utSetzen(t);
  // obere Textzeile + Werbung immer sichtbar (ab Bild 0)
}
window.__frame=t=>new Promise(res=>{frame(t);requestAnimationFrame(()=>requestAnimationFrame(()=>res(true)))});
start().catch(e=>{document.title='FEHLER '+e.message;console.error(e);window.__fehler=String(e)});
</script>
