<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Maios Vollbild (Editorial Dark)</title>
<!--
  Maios Vollbild-Vorlage (neu 17.11.2026): große echte Shopfotos statt kleiner Karten, Look „Editorial Dark“ wie der Shop
  (warmes Schwarz #0B0A09/#13100B, Gold #D8B56C, Marcellus + Manrope). Bewegung mit Federn nach dem Skill apple-design:
  kritisch gedämpft (ζ 1, Antwort 0,3–0,45 s) als Standard, leichtes Nachschwingen (ζ ~0,8) nur bei Schwung (hereingeworfene
  Karten, Antippen). Rein-/Rausweg gleich (Feed-Wischen nach oben).
  Bausteine: duell (Runden als Feed, zwei hohe Fotopaneele, „oder“, Antippen links/rechts), finale (Fächer aller Farben,
  dann Endkarte), bild (Foto voll oder als Band über Unschärfe-Hintergrund, Ken Burns, Untertitel Wort für Wort),
  typo (große Schrift, Wort durchstreichen), ende (Endkarte mit Foto).
  Text bleibt in der TikTok-Zone (x 72–888, y 168–1330), Fotos dürfen vollflächig sein.
  Schnittstelle wie spot.html: window.__ready, window.__dauer, window.__frame(t), window.__events.
  Rendern:  node Marketing/cgi/spot/render_spot.mjs <cfg>.json --seite Marketing/cgi/spot/voll.html --out x.mp4
  Ansehen:  voll.html?cfg=/Marketing/cgi/spot/<cfg>.json&t=1.5
-->
<style>
@font-face{font-family:'Manrope';src:url(../fonts/manrope-latin.woff2) format('woff2');font-weight:200 800}
@font-face{font-family:'Manrope';src:url(../fonts/manrope-latin-ext.woff2) format('woff2');font-weight:200 800;unicode-range:U+0100-02BA,U+20A0-20C0}
@font-face{font-family:'Marcellus';src:url(../fonts/marcellus-latin.woff2) format('woff2');font-weight:400}
:root{--tief:#0B0A09;--bg:#13100B;--gold:#D8B56C;--goldp:#E4C077;--golddk:#8C6A2A;--txt:#F5F0E6;--muted:#A79E8B;--ink:#1C1813}
html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:var(--tief)}
*{box-sizing:border-box}
#b{position:absolute;inset:0;font-family:Manrope,sans-serif;color:var(--txt);-webkit-font-smoothing:antialiased;overflow:hidden}
#bg{position:absolute;inset:0}
.sz{position:absolute;inset:0}
.abs{position:absolute}
.serif{font-family:Marcellus,serif;font-weight:400}
/* Duell */
.dp{position:absolute;width:440px;height:900px;border-radius:34px;overflow:hidden;background:#fff;
  box-shadow:0 40px 90px rgba(0,0,0,.55),0 4px 14px rgba(0,0,0,.35)}
.dp img{position:absolute;max-width:none}
.dp .nm{position:absolute;left:0;right:0;top:812px;text-align:center;font-family:Marcellus,serif;font-size:46px;color:var(--ink);white-space:nowrap}
.dp .strich{position:absolute;left:50%;top:872px;width:120px;height:5px;margin-left:-60px;border-radius:3px;background:var(--gold);transform-origin:50% 50%}
.vs{position:absolute;left:400px;top:812px;width:160px;height:160px;border-radius:80px;background:var(--gold);color:var(--bg);
  display:flex;align-items:center;justify-content:center;font-family:Marcellus,serif;font-size:50px;z-index:6;
  box-shadow:0 0 0 10px rgba(11,10,9,.92),0 18px 40px rgba(0,0,0,.5)}
.welle{position:absolute;width:0;height:0;z-index:7}
.welle i{position:absolute;left:-60px;top:-60px;width:120px;height:120px;border-radius:60px;border:6px solid var(--gold)}
.runde{left:72px;width:816px;top:366px;text-align:center;font-size:33px;font-weight:700;color:#D9D0BD;letter-spacing:.01em}
/* Fächer + Endkarte */
.fk{position:absolute;width:250px;height:430px;border-radius:26px;overflow:hidden;background:#fff;
  box-shadow:0 26px 60px rgba(0,0,0,.6),0 3px 10px rgba(0,0,0,.35);transform-origin:50% 100%}
.fk img{position:absolute;max-width:none}
.fz{left:72px;width:816px;top:300px;text-align:center;font-family:Marcellus,serif;font-size:300px;line-height:1;color:var(--goldp)}
.fl{left:72px;width:816px;top:620px;text-align:center;font-size:56px;font-weight:800;letter-spacing:-.02em}
.ew{left:72px;width:816px;top:318px;text-align:center;font-family:Marcellus,serif;font-size:66px;line-height:1.1;color:var(--txt)}
.ep{left:72px;width:816px;top:420px;text-align:center;font-size:178px;font-weight:800;letter-spacing:-.045em;line-height:1;color:var(--goldp)}
.el{left:300px;width:360px;top:640px;height:96px;border-radius:48px;background:var(--gold);color:var(--bg);font-size:40px;font-weight:800;
  display:flex;align-items:center;justify-content:center}
.eh{left:72px;width:816px;top:768px;text-align:center;font-size:40px;font-weight:700;color:var(--txt)}
.em{left:72px;width:816px;top:840px;text-align:center;font-family:Marcellus,serif;font-size:40px;letter-spacing:.42em;padding-left:.42em;color:var(--muted)}
/* Bild-Szenen */
.amb{position:absolute;left:0;top:0;width:270px;height:480px;overflow:hidden;transform-origin:0 0;transform:scale(4);filter:blur(10px) brightness(.42) saturate(.85)}
.amb img{position:absolute;max-width:none}
.ton{position:absolute;inset:0;background:rgba(19,16,11,.45)}
.rahmen{position:absolute;overflow:hidden;background:#000}
.rahmen img{position:absolute;max-width:none;left:0;top:0;transform-origin:0 0}
.linie{position:absolute;left:0;width:1080px;height:2px;background:linear-gradient(90deg,rgba(216,181,108,0),rgba(216,181,108,.75) 20%,rgba(216,181,108,.75) 80%,rgba(216,181,108,0))}
.verlauf{position:absolute;left:0;top:0;width:1080px;height:760px;background:linear-gradient(180deg,rgba(11,10,9,.88) 0%,rgba(11,10,9,.62) 45%,rgba(11,10,9,0) 100%)}
.cap{left:72px;width:816px;text-align:center;font-weight:800;font-size:66px;line-height:1.14;letter-spacing:-.02em;color:var(--txt);
  text-shadow:0 3px 14px rgba(0,0,0,.65)}
.cap.gross{font-size:92px}
.cap .w{display:inline-block;white-space:pre;will-change:transform,opacity,filter}
.typo{left:72px;width:816px;top:640px;text-align:center;font-family:Marcellus,serif;font-size:128px;line-height:1.08;color:var(--txt)}
.typo .w{display:inline-block;white-space:pre;position:relative}
.typo .ak{color:var(--goldp)}
.typo .st{position:absolute;left:-6px;right:-6px;top:54%;height:10px;border-radius:5px;background:var(--gold);transform-origin:0 50%}
.hp{position:absolute;overflow:hidden;border-radius:34px;background:#fff;box-shadow:0 40px 90px rgba(0,0,0,.6),0 0 0 2px rgba(216,181,108,.35)}
.hp img{position:absolute;max-width:none;left:0;top:0;transform-origin:0 0}
/* Ohne Fotos (17.11.): Farb-Duell, Farbfinale, Strich-Piktogramme */
.ff{position:absolute;top:0;height:1920px;overflow:hidden}
.fbech{position:absolute;width:396px;height:593px;margin-left:-198px;transform-origin:50% 60%}
.fname{position:absolute;top:1168px;width:420px;margin-left:-210px;text-align:center;font-size:52px;font-weight:800;letter-spacing:-.02em;white-space:nowrap}
.rpill{left:72px;width:816px;top:370px;text-align:center}
.rpill span{display:inline-block;background:rgba(19,16,11,.86);color:#E9E1CF;font-size:30px;font-weight:700;padding:6px 20px;border-radius:22px}
.fstreif{position:absolute;left:0;top:0;width:135px;height:1920px}
.fkarte{left:220px;width:520px;top:600px;height:520px;border-radius:44px;background:rgba(19,16,11,.93);box-shadow:0 30px 80px rgba(0,0,0,.45);
  display:flex;flex-direction:column;align-items:center;justify-content:center}
.fkarte .z8{font-family:Marcellus,serif;font-size:290px;line-height:.95;color:var(--goldp)}
.fkarte .zl{font-size:54px;font-weight:800;letter-spacing:-.02em;margin-top:6px}
.zw{position:absolute;left:170px;top:530px;width:620px;height:620px}
.zw svg{width:620px;height:620px;overflow:visible}
.zw .z{fill:none;stroke:var(--gold);stroke-width:9;stroke-linecap:round;stroke-linejoin:round}
.zw .zf{fill:var(--gold);stroke:none}
.wert{left:72px;width:816px;top:1170px;text-align:center;font-size:140px;font-weight:800;letter-spacing:-.04em;line-height:1;color:var(--goldp);white-space:nowrap}
.wert.klein{font-size:66px;letter-spacing:-.02em;color:var(--goldp);top:1190px}
/* oben: Werbung, Produktwort, Hook */
#korn{position:absolute;left:-40px;top:-40px;opacity:.06;pointer-events:none;mix-blend-mode:screen;z-index:40}
#vign{position:absolute;inset:0;pointer-events:none;z-index:41;background:radial-gradient(80% 62% at 50% 50%,rgba(0,0,0,0) 58%,rgba(0,0,0,.55) 100%)}
#ober{position:absolute;inset:0;pointer-events:none;z-index:50}  /* Werbung + Produktwort immer über allen Szenen */
.pill{position:absolute;top:200px;height:60px;border-radius:30px;padding:0 24px;font-size:30px;font-weight:700;display:flex;align-items:center;white-space:nowrap}
.pw{left:50px;background:#F2ECDF;color:#0F0D0A}
.pp{background:rgba(19,16,11,.88);color:var(--txt);border:1px solid rgba(216,181,108,.45)}
#oben{position:absolute;left:72px;width:816px;top:286px;text-align:center}
#oben span{display:inline-block;white-space:nowrap;background:var(--txt);color:var(--bg);font-size:39px;font-weight:800;letter-spacing:-.015em;padding:11px 24px;border-radius:14px;
  box-shadow:0 10px 30px rgba(0,0,0,.45)}
</style>
</head>
<body>
<div id="b"><div id="bg"></div><div id="szenen"></div>
  <svg id="korn" width="1160" height="2000"><filter id="kf"><feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="2" seed="3"/><feColorMatrix type="saturate" values="0"/></filter><rect width="1160" height="2000" filter="url(#kf)"/></svg>
  <div id="vign"></div>
  <div id="ober"><div class="pill pw">Werbung</div><div class="pill pp" id="pwort"></div><div id="oben"><span></span></div></div>
</div>
<script>
// ---------- Hilfen ----------
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,x)=>a+(b-a)*x;
const seg=(t,a,b)=>clamp((t-a)/(b-a));
const E={out:x=>1-Math.pow(1-x,3),in:x=>x*x*x,inOut:x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2};
// Feder (Antwort = Zeit bis fast am Ziel, ζ = Dämpfung; 1 = kein Nachschwingen). Analytisch, hängt nur an t.
function feder(t,resp=0.4,z=1){if(t<=0)return 0;const w=2*Math.PI/resp;
  if(z>=0.999)return 1-Math.exp(-w*t)*(1+w*t);const wd=w*Math.sqrt(1-z*z);
  return 1-Math.exp(-z*w*t)*(Math.cos(wd*t)+(z*w/wd)*Math.sin(wd*t));}
const huckel=(t,a,b)=>Math.sin(Math.PI*seg(t,a,b));
function rng(s){let a=s>>>0;return()=>{a|=0;a=(a+0x6D2B79F5)|0;let t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296}}
const el=(tag,cls,par,html)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;(par||document.body).appendChild(e);return e};
const bild=p=>'/'+p.split('/').map(encodeURIComponent).join('/');
const css=(e,o)=>{for(const k in o)e.style[k]=o[k]};
const Q=new URLSearchParams(location.search);
let CFG,SZ=[],DAUER=0;const EV=[];
const ev=(t,typ,st)=>EV.push({t:+Math.max(0,t).toFixed(3),typ,staerke:st??1});
const FEED=1580, GAP=990, LEAD=0.12;  // Feed-Wischen: Weg und Vorlauf vor dem Schlag

// Becher/Produkt im Paneel: bbox [x0,x1,y0,y1] in % des Fotos → Produkt so hoch wie hoehe, waagerecht mittig bei mx, Oberkante bei oy
function stelleProdukt(img,bbox,hoehe,mx,oy){const nw=img.naturalWidth,nh=img.naturalHeight;
  const dh=hoehe/((bbox[3]-bbox[2])/100),dw=dh*nw/nh,cx=(bbox[0]+bbox[1])/200;
  css(img,{width:dw+'px',height:dh+'px',left:(mx-cx*dw)+'px',top:(oy-bbox[2]/100*dh)+'px'});}
// Ausschnitt q=[x,y,w,h] (Pixel im Foto) füllt Rahmen RW×RH (wie cover), Zoom z um Fokus f=[fx,fy] (0..1 im Ausschnitt); nie Rand außerhalb von q
function setzeAusschnitt(img,q,RW,RH,z,f){const nw=img.naturalWidth,nh=img.naturalHeight;
  const s=Math.max(RW/q[2],RH/q[3])*z,px=q[0]+f[0]*q[2],py=q[1]+f[1]*q[3];
  const tx=clamp(RW/2-px*s,RW-(q[0]+q[2])*s,-q[0]*s),ty=clamp(RH/2-py*s,RH-(q[1]+q[3])*s,-q[1]*s);
  css(img,{width:nw*s+'px',height:nh*s+'px',transform:`translate(${tx}px,${ty}px)`});}

const B={};

// ---------- Duell: Runden als Feed (Wischen nach oben), zwei hohe Paneele, „oder“, erst links, dann rechts angetippt ----------
// runden: [{l:[Name,Foto,bbox], r:[Name,Foto,bbox]}…], runde (s), tipp [a,b] (s je Runde), ausgang (letzte Runde wischt nach oben weg)
B.duell={bau(r,s){
  s.R=s.runde||1.858;s.ta=(s.tipp||[0.93,1.39])[0];s.tb=(s.tipp||[0.93,1.39])[1];s.N=s.runden.length;
  s.box=s.runden.map((rd,k)=>{const g=el('div','abs',r);css(g,{left:'0',top:'0',width:'1080px',height:'1920px'});
    const pan=(seite,[nm,ft,bb],x)=>{const p=el('div','dp',g,`<img src="${bild(ft)}"><div class="nm">${nm}</div><div class="strich"></div>`);
      css(p,{left:x+'px',top:'442px'});return {p,bb,img:p.querySelector('img'),nm:p.querySelector('.nm'),st:p.querySelector('.strich'),x}};
    const L=pan('l',rd.l,30),Rr=pan('r',rd.r,490);
    const wl=el('div','welle',g,'<i></i>'),wr=el('div','welle',g,'<i></i>');css(wl,{left:'250px',top:'872px'});css(wr,{left:'710px',top:'872px'});
    return {g,L,R:Rr,wl,wr,k}});
  s.vs=el('div','vs',r,s.vs_text||'oder');s.rl=el('div','abs runde',r,'');
  for(let k=0;k<s.N;k++){const t0=s.t0+k*s.R;
    if(k>0)ev(t0-LEAD,'whoosh',0.6);ev(t0+0.18,'pop',0.7);ev(t0+s.ta,'klick',0.95);ev(t0+s.tb,'klick',0.95);}
  ev(s.t0,'whoosh',0.7);if(s.ausgang)ev(s.t0+s.dauer-LEAD,'whoosh',0.6);
},set(lt,s){
  if(!s.box[0].L.done){for(const b of s.box)for(const P of [b.L,b.R])stelleProdukt(P.img,P.bb,740,220,40);s.box[0].L.done=true;}
  // Feed-Position: jede Rundengrenze schiebt um eins weiter (kritisch gedämpfte Feder)
  let f=0;for(let j=1;j<s.N;j++)f+=feder(lt-(j*s.R-LEAD),0.4,1);
  if(s.ausgang)f+=feder(lt-(s.dauer-LEAD),0.4,1);
  const k=clamp(Math.floor(lt/s.R),0,s.N-1),u=lt-k*s.R;
  for(const b of s.box){
    const d=b.k-f,y=d*GAP,sicht=clamp((1-Math.abs(d))*3.5);if(sicht<=0.001){b.g.style.display='none';continue}b.g.style.display='block';
    const uu=lt-b.k*s.R;
    // erste Runde: Paneele kommen mit Schwung von den Seiten (ab Bild 0 schon fast da)
    const sx=b.k===0?(1-feder(lt+0.24,0.45,0.82)):0;
    const tief=1-0.035*Math.sin(Math.PI*clamp(Math.abs(f-Math.round(f))*2,0,1));  // beim Wischen leicht kleiner (Tiefe)
    css(b.g,{transform:`translateY(${y}px) scale(${tief})`,transformOrigin:'480px 890px',opacity:sicht});
    // Antippen: links von ta bis tb, rechts ab tb; Druck beim Aufsetzen sofort, dann Feder zurück
    const los=(b.k<s.N-1||s.ausgang)?feder(uu-(s.R-0.34),0.26,1):0;
    const hL=clamp(feder(uu-s.ta,0.3,1)-feder(uu-s.tb,0.3,1)),hR=clamp(feder(uu-s.tb,0.3,1)-los);
    const druck=(tt)=>0.04*huckel(uu,tt-0.06,tt+0.1);
    const fed=(tt)=>0.03*clamp(feder(uu-tt-0.04,0.35,0.7),0,1.4);
    const setz=(P,h,hAnders,tt,dx)=>{
      const sc=1-druck(tt)+(h>0.02?fed(tt)*h:0);
      css(P.p,{transform:`translateX(${dx}px) scale(${sc})`,boxShadow:`0 40px 90px rgba(0,0,0,.55), 0 0 0 ${8*h}px var(--gold)`,
        filter:`brightness(${1-0.42*hAnders}) saturate(${1-0.3*hAnders})`,zIndex:h>0.05?3:1});
      P.nm.style.color=h>0.4?'var(--golddk)':'var(--ink)';P.nm.style.opacity=clamp(1-Math.abs(y)/200);css(P.st,{transform:`scaleX(${h})`,opacity:h*clamp(1-Math.abs(y)/200)});
    };
    setz(b.L,hL,hR,s.ta,-560*sx);setz(b.R,hR,hL,s.tb,560*sx);
    // Tipp-Welle am Antipp-Punkt
    for(const [w,tt] of [[b.wl,s.ta],[b.wr,s.tb]]){const p=seg(uu,tt,tt+0.5);const i=w.firstChild;
      css(i,{opacity:p>0&&p<1?(1-p)*0.9:0,transform:`scale(${0.3+1.5*E.out(p)})`});}
  }
  // „oder“ springt je Runde neu auf (leichtes Nachschwingen), bleibt am Platz
  const ur=lt-k*s.R,pop=feder(ur-0.12,0.42,0.62),weg=s.ausgang?feder(lt-(s.dauer-LEAD),0.3,1):0;
  css(s.vs,{transform:`scale(${(0.55+0.45*pop)*(1-weg)}) rotate(${(1-pop)*-14}deg)`,opacity:clamp(pop*1.5)*(1-weg)});
  s.rl.textContent=`Runde ${k+1} von ${s.N}`;css(s.rl,{opacity:1-weg});
}};

// ---------- Finale: Fächer aller Farben (Zahl aus products.json), danach Endkarte; Fächer rutscht nach unten ----------
// fotos [[Name,Foto,bbox]…], wert, label, wechsel (s), wort, preis, link, hinweis
B.finale={bau(r,s){
  s.g=el('div','abs',r);css(s.g,{left:'0',top:'0',width:'1080px',height:'1920px'});
  const n=s.fotos.length,spanne=s.spanne||40;
  s.k=s.fotos.map(([nm,ft,bb],i)=>{const e=el('div','fk',s.g,`<img src="${bild(ft)}">`);
    const a=n>1?-spanne/2+spanne*i/(n-1):0;return {e,bb,img:e.querySelector('img'),a,i}});
  s.z=el('div','abs fz',s.g,String(s.wert));s.l=el('div','abs fl',s.g,s.label||'');
  s.w=el('div','abs ew',r,s.wort);s.p=el('div','abs ep',r,s.preis);s.li=el('div','abs el',r,s.link||'Link im Profil');
  s.h=el('div','abs eh',r,s.hinweis||'Versandkostenfrei in Deutschland');s.m=el('div','abs em',r,'MAIOS');
  s.wx=s.wechsel??1.858;
  ev(s.t0+0.02,'whoosh',0.5);s.k.forEach((c,i)=>ev(s.t0+0.06+i*0.04+0.18,'tipp',0.55));ev(s.t0+0.3,'ting',0.9);
  ev(s.t0+s.wx,'whoosh',0.55);ev(s.t0+s.wx+0.3,'ting',0.95);
},set(lt,s){
  if(!s.k[0].done){for(const c of s.k)stelleProdukt(c.img,c.bb,350,125,30);s.k[0].done=true;}
  const ein=feder(lt+LEAD,0.4,1);css(s.g,{transform:`translateY(${(1-ein)*GAP}px)`,opacity:clamp(ein*3.5)});
  const runter=feder(lt-s.wx,0.45,1);  // Fächer gleitet für die Endkarte nach unten und wird kleiner
  const PX=465,PY=1960+runter*60,RAD=760-runter*160,sc=1-0.24*runter;
  for(const c of s.k){const p=feder(lt+0.14-c.i*0.035,0.5,0.8);   // geworfen: leichtes Nachschwingen
    const a=c.a*p*Math.PI/180,x=PX+RAD*Math.sin(a)-125,y=PY-RAD*Math.cos(a)-430;
    css(c.e,{left:x+'px',top:lerp(1500,y,clamp(p,0,1.2))+'px',transform:`rotate(${c.a*p}deg) scale(${sc*lerp(.8,1,clamp(p))})`,
      opacity:clamp(p*2.5),filter:`brightness(${1-0.05*runter})`,zIndex:Math.round(20-2*Math.abs(c.i-(s.k.length-1)/2))});}
  const zp=feder(lt+0.04,0.42,0.7),lp=feder(lt+0.04,0.4,1),zw=1-feder(lt-s.wx+0.14,0.18,1);
  css(s.z,{opacity:clamp(zp)*zw,transform:`scale(${lerp(.7,1,clamp(zp,0,1.2))}) translateY(${(1-zw)*-60}px)`});
  css(s.l,{opacity:lp*zw,transform:`translateY(${(1-lp)*30+(1-zw)*-60}px)`});
  const a=feder(lt-s.wx+0.02,0.4,1),b=feder(lt-s.wx-0.12,0.4,1),c=feder(lt-s.wx-0.34,0.4,0.72),d=feder(lt-s.wx-0.12,0.4,1);

// Szene mit Piktogramm: text (oben, Wort für Wort), icon, wert (groß, gold), wert_klein, vorlauf (s, Zeichnung schon begonnen bei Bild 0)
B.zeichen={bau(r,s){
  s.zw=el('div','zw',r,`<svg viewBox="0 0 400 400">${ICON[s.icon]()}</svg>`);s.pf=[...s.zw.querySelectorAll('.z')];
  s.cap=el('div','abs cap'+(s.gross?' gross':''),r);s.cap.style.top=(s.text_y??330)+'px';
  s.w=[];let i=0;if(s.text)for(const roh of s.text.split(/ +/).filter(Boolean)){const ak=/^\*.*\*[.,!?:]?$/.test(roh);const w=el('span','w',s.cap,roh.replace(/\*/g,'')+' ');s.w.push({e:w,ak,i:i++});}
  if(s.wert){s.we=el('div','abs wert'+(s.wert_klein?' klein':''),r,s.wert);}
  s.takt=s.takt||0.085;s.vl=s.vorlauf||0;
  if(s.t0>0)ev(s.t0,'whoosh',0.35);s.w.forEach((w,i)=>{if(i<4)ev(s.t0+0.3+i*s.takt,'tipp',0.75)});
  const ik={uhr:[[0.55,'tipp'],[0.75,'tipp'],[1.0,'ting']],mikrowelle:[[0.72,'klick']],box:[[0.6,'ting']],autostecker:[[0.72,'klick']],steckdose:[[0.6,'klick']],
    behaelter:[[0.6,'pop'],[0.8,'pop']],besteck:[[0.5,'pop'],[0.65,'pop'],[0.8,'pop']],auto:[]}[s.icon]||[];
  ik.forEach(([t,typ])=>ev(s.t0+t,typ,0.8));if(s.wert)ev(s.t0+0.5,'ting',0.7);
},set(lt,s){
  const L=lt+s.vl,erst=s.t0===0;s.r.style.opacity=lt<0?0:(erst?1:clamp(lt/0.06+0.4))*(lt>s.dauer?clamp(1-(lt-s.dauer)/0.05):1);
  s.pf.forEach((p,i)=>{if(p.classList.contains('str'))return;const q=E.out(clamp((L-0.02-i*0.035)/0.5));p.style.strokeDasharray='1 1';p.style.strokeDashoffset=String(1-q);});
  const ein=feder(L+0.05,0.4,1);css(s.zw,{transform:`translateY(${(1-ein)*60}px) scale(${lerp(.94,1,ein)})`});
  const q=(sel)=>s.zw.querySelector(sel);
  if(q('.m')){const p=E.inOut(seg(L,0.2,1.0));css(q('.m'),{transform:`rotate(${p*180}deg)`,transformOrigin:'200px 200px'});css(q('.h'),{transform:`rotate(${p*15}deg)`,transformOrigin:'200px 200px'});}
  if(q('.str')){const p=E.out(seg(L,0.66,0.9));const st=q('.str');st.style.strokeDasharray='1 1';st.style.strokeDashoffset=String(1-p);}
  if(q('.wel'))[...q('.wel').children].forEach((w,i)=>{const ph=((L*0.9+i*0.33)%1);css(w,{transform:`translateY(${-ph*36}px)`,opacity:L<0.4?0:Math.sin(Math.PI*ph)});});
  if(q('.teller'))css(q('.teller'),{transform:`translateY(${Math.sin(L*3.2)*6}px)`});
  if(q('.fahr'))[...q('.fahr').children].forEach((w)=>{css(w,{transform:`translateX(${-((L*420)%420)}px)`})});
  if(q('.stk')){const p=feder(L-0.3,0.42,0.85);css(q('.stk'),{transform:`translateY(${(1-p)*90}px)`});}
  [...s.zw.querySelectorAll('.fu')].forEach((f,i)=>{const p=E.out(seg(L,0.4+i*0.2,0.9+i*0.2));css(f,{transformBox:'fill-box',transformOrigin:'center bottom',transform:`scaleY(${p})`});});
  s.w.forEach((w,i)=>{const a=0.06+i*s.takt,qq=feder(lt-a+(erst?0.5:0),0.32,1),nx=0.06+(i+1)*s.takt;const aktiv=lt>=a&&lt<nx+0.12&&lt<0.06+s.w.length*s.takt+0.1;
    css(w.e,{opacity:qq,filter:`blur(${(1-qq)*10}px)`,transform:`translateY(${(1-qq)*34}px)`,color:(w.ak||aktiv)?'var(--goldp)':'var(--txt)'});});
  if(s.we){const p=feder(lt-0.45,0.4,0.78);css(s.we,{opacity:clamp(p*1.4),transform:`scale(${lerp(.8,1,clamp(p,0,1.15))})`});}
}};

// ---------- Aufbau ----------
async function start(){
  CFG=await (await fetch(Q.get('cfg'))).json();
  document.getElementById('pwort').textContent=CFG.wort;document.getElementById('pwort').style.left='250px';
  const ob=document.getElementById('oben');if(CFG.oben)ob.firstChild.textContent=CFG.oben;else ob.style.display='none';
  let t=0;const root=document.getElementById('szenen');
  for(const s of CFG.szenen){s.t0=t;s.r=el('div','sz',root);B[s.typ].bau(s.r,s);SZ.push(s);t+=s.dauer;}
  DAUER=t;window.__dauer=DAUER;window.__events=EV.sort((a,b)=>a.t-b.t);
  await Promise.all([...document.images].map(i=>i.decode().catch(()=>{throw new Error('Bild fehlt: '+i.src)})));
  await document.fonts.load('800 40px Manrope');await document.fonts.load('40px Marcellus');await document.fonts.ready;
  if(!document.fonts.check('800 40px Manrope'))throw new Error('Schrift Manrope fehlt');
  if(!document.fonts.check('40px Marcellus'))throw new Error('Schrift Marcellus fehlt');
  window.__ready=true;if(Q.has('t'))frame(+Q.get('t'));
}
function frame(t){
  const g=document.getElementById('bg');const gx=50+Math.sin(t*0.35)*14,gy=46+Math.cos(t*0.27)*8;
  g.style.background=`radial-gradient(90% 60% at ${gx}% ${gy}%, #241D13 0%, #13100B 45%, #0B0A09 100%)`;
  for(const s of SZ){const lt=t-s.t0;
    if(lt<-0.35||lt>s.dauer+0.35){s.r.style.display='none';continue}
    s.r.style.display='block';s.r.style.zIndex=String(SZ.indexOf(s)+1);B[s.typ].set(lt,s);}
  // Filmkorn bewegt sich leicht (2 Bilder je Stellung)
  const R=rng(Math.floor(t*15)+5);css(document.getElementById('korn'),{transform:`translate(${(R()*40-20).toFixed(1)}px,${(R()*40-20).toFixed(1)}px)`});
  // Hook nur bis oben_bis (dann federt er weg)
  const ob=document.getElementById('oben');if(CFG.oben){const bis=CFG.oben_bis??DAUER;const w=feder(t-bis,0.3,1);
    const ein=feder(t+0.2,0.35,1);css(ob,{opacity:clamp(ein*1.3)*(1-w),transform:`translateY(${(1-ein)*-20+w*-30}px)`});}
}
window.__frame=t=>new Promise(res=>{frame(t);requestAnimationFrame(()=>requestAnimationFrame(()=>res(true)))});
start().catch(e=>{document.title='FEHLER '+e.message;console.error(e);window.__fehler=String(e)});
</script>
